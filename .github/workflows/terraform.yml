# Name shown in the GitHub Actions tab
name: Deploy AWS Infrastructure with Terraform

# Run on pushes and pull requests targeting main
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    # AWS credentials stored in GitHub repository secrets
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      # Step 1: Download the repository contents
      - name: Checkout repo
        uses: actions/checkout@v5

      # Step 2: Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      # Step 3: Display the installed Terraform version
      - name: Terraform Version
        run: terraform version

      # Step 4: Check Terraform formatting
      - name: Terraform Format Check
        run: terraform fmt -check

      # Step 5: Initialize Terraform and download providers
      - name: Terraform Init
        run: terraform init -upgrade -input=false

      # Step 6: Validate the Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Step 7: Create an execution plan
      - name: Terraform Plan
        run: terraform plan -input=false

      # Step 8: Apply only on a push or merge to main
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false